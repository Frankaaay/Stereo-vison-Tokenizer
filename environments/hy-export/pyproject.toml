[project]
name = "stereo-vision-tokenizer-hy-export-runtime"
version = "0.0.0"
description = "Locked CPU runtime for exporting the Hy mono smoke cache"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.2",
    "pillow==12.3.0",
    "pyarrow==23.0.0",
    "pylance==8.0.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
