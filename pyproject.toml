[project]
name = "stereo-vision-tokenizer-runtime"
version = "0.0.0"
description = "Locked training runtime for the StereoVAE four-mode branch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==16.0.1",
    "beartype",
    "einops",
    "huggingface-hub",
    "imageio",
    "joblib",
    "numpy==1.26.2",
    "omegaconf",
    "open3d",
    "opencv-python==4.11.0.86",
    "pandas",
    "pillow",
    "pyarrow==23.0.0",
    "pytest",
    "pytorch-lightning==2.5.6",
    "requests",
    "safetensors",
    "scipy",
    "thop",
    "timm",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm",
    "transformations",
    "trimesh",
    "wandb==0.23.1",
    "xformers==0.0.31.post1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
